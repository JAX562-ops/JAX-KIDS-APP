name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create project
        run: |
          rm -rf.github/workflows/github
          mkdir -p app/src/main/java/com/jaxkids/live
          mkdir -p app/src/main/assets
          python3 << 'PY'
          import pathlib
          pathlib.Path("settings.gradle").write_text("include ':app'\n")
          pathlib.Path("build.gradle").write_text("plugins { id 'com.android.application' version '8.2.2' apply false }\n")
          pathlib.Path("app/build.gradle").write_text("""
          plugins { id 'com.android.application' }
          android {
              namespace 'com.jaxkids.live'
              compileSdk 34
              defaultConfig {
                  applicationId "com.jaxkids.live"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes {
                  release { minifyEnabled false }
                  debug { minifyEnabled false }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'androidx.webkit:webkit:1.8.0'
          }
          """)
          pathlib.Path("app/src/main/AndroidManifest.xml").write_text("""<?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <application android:label="JAX KIDS LIVE" android:theme="@android:style/Theme.NoTitleBar">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          """)
          pathlib.Path("app/src/main/java/com/jaxkids/live/MainActivity.java").write_text("""
          package com.jaxkids.live;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import androidx.appcompat.app.AppCompatActivity;
          public class MainActivity extends AppCompatActivity {
            protected void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              WebView w = new WebView(this);
              setContentView(w);
              w.getSettings().setJavaScriptEnabled(true);
              w.getSettings().setDomStorageEnabled(true);
              w.getSettings().setAllowFileAccess(true);
              w.setWebViewClient(new WebViewClient());
              try {
                w.loadUrl("file:///android_asset/index.html");
              } catch (Exception e) {
                w.loadData("<html><body><h1>JAX KIDS LIVE</h1><h2>MTN 0778327099 Airtel 0708404878</h2></body></html>", "text/html", "UTF-8");
              }
            }
          }
          """)
          p = pathlib.Path("app/src/main/assets/index.html")
          if not p.exists():
              p.write_text("<html><head><meta name='viewport' content='width=device-width,initial-scale=1'><style>body{font-family:sans-serif;text-align:center;padding:40px}h1{color:#4CAF50}</style></head><body><h1>JAX KIDS LIVE TEACHING APP</h1><h2>Uganda's #1 Kids Learning</h2><p>Pay: MTN 0778327099</p><p>Airtel 0708404878</p><p>Loading your lessons...</p><script>if(window.location.href.includes('file')){document.body.innerHTML+='<p>App Ready!</p>'}</script></body></html>")
          PY
          ls app/src/main/assets/
          cat app/build.gradle
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v3
      - name: Build APK
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: JAX-KIDS-APK
          path: app/build/outputs/apk/debug/*.apk
